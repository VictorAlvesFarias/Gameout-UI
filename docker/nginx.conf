server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Generated at container start from API_URL: never cache it.
    location = /environment.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA (the same rule as public/web.config on IIS).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
